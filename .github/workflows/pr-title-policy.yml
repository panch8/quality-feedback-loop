name: PR title (conventional)
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      title:
        type: string
        default: ''
      policy_repository:
        type: string
        default: panch8/quality-feedback-loop
      policy_ref:
        type: string
        default: main
permissions:
  contents: read
jobs:
  policy:
    name: PR title (conventional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ endsWith(github.repository, '/quality-feedback-loop') && github.repository || inputs.policy_repository || 'panch8/quality-feedback-loop' }}
          ref: ${{ endsWith(github.repository, '/quality-feedback-loop') && github.sha || inputs.policy_ref || 'main' }}
          path: qfl-policy
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the PR title sets a version bump
        env:
          QFL_PR_TITLE: ${{ inputs.title || github.event.pull_request.title }}
        run: node qfl-policy/scripts/qfl-version.js check-title --host=github
