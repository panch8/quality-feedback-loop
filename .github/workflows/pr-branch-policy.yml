name: PR branch graph
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      base:
        type: string
        default: ''
      head:
        type: string
        default: ''
      policy_repository:
        type: string
        default: panch8/quality-feedback-loop
      policy_ref:
        type: string
        default: main
permissions:
  contents: read
jobs:
  policy:
    name: PR branch graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: caller
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ endsWith(github.repository, '/quality-feedback-loop') && github.repository || inputs.policy_repository || 'panch8/quality-feedback-loop' }}
          ref: ${{ endsWith(github.repository, '/quality-feedback-loop') && github.sha || inputs.policy_ref || 'main' }}
          path: qfl-policy
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check branch graph and integration ancestry
        env:
          QFL_BASE: ${{ inputs.base || github.event.pull_request.base.ref }}
          QFL_HEAD: ${{ inputs.head || github.event.pull_request.head.ref }}
        working-directory: caller
        run: node ../qfl-policy/scripts/check-pr-policy.js --base "$QFL_BASE" --head "$QFL_HEAD"
